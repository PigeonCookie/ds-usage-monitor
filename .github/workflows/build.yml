name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages (platform 34 + build-tools 35)
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          $mgr = Get-ChildItem $sdk -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $mgr) { throw "sdkmanager not found under $sdk" }
          & $mgr --install 'platforms;android-34' 'build-tools;35.0.0'

      - name: Show toolchain versions (helps diagnose CI-only failures)
        shell: cmd
        run: |
          echo ANDROID_SDK_ROOT=%ANDROID_SDK_ROOT%
          echo ANDROID_HOME=%ANDROID_HOME%
          echo JAVA_HOME=%JAVA_HOME%
          java -version
          javac -version
          dir /b "%ANDROID_SDK_ROOT%\build-tools"
          dir /b "%ANDROID_SDK_ROOT%\platforms"

      - name: Build (aapt2 + javac + d8 + apksigner, no Gradle)
        shell: cmd
        run: tools\build.cmd -Sdk "%ANDROID_SDK_ROOT%" -BuildTools 35.0.0

      - name: Core logic tests are part of the build; upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: DSMonitor-apk
          path: dist/*.apk
          if-no-files-found: error
